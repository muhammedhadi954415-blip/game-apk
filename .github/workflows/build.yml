name: Build Chrono Protocol Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build ARM64 native game and package signed APK
        shell: bash
        run: |
          set -euxo pipefail
          export NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          export BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          export PLATFORM="$(find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/android.jar"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CC="$TOOLCHAIN/aarch64-linux-android29-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android29-clang++"

          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib
          mkdir -p obj lib/arm64-v8a

          # Build raylib's Android/OpenGL ES 2 implementation.
          for src in rcore rshapes rtextures rtext rmodels utils raudio; do
            "$CC" -c "raylib/src/${src}.c" -O2 -fPIC \
              -DPLATFORM_ANDROID -DGRAPHICS_API_OPENGL_ES2 -D__ANDROID_API__=29 \
              -Iraylib/src -Iraylib/src/external/khronos \
              -Iraylib/src/external/glfw/include \
              -I"$NDK/sources/android/native_app_glue" \
              -o "obj/${src}.o"
          done

          "$CC" -c "$NDK/sources/android/native_app_glue/android_native_app_glue.c" \
            -O2 -fPIC -D__ANDROID_API__=29 -I"$NDK/sources/android/native_app_glue" \
            -o obj/native_app_glue.o

          "$CXX" -c main.cpp -std=c++20 -O2 -fPIC -fexceptions -frtti \
            -DPLATFORM_ANDROID -DGRAPHICS_API_OPENGL_ES2 -D__ANDROID_API__=29 \
            -Iraylib/src -I"$NDK/sources/android/native_app_glue" -o obj/main.o

          "$CXX" -shared -Wl,-soname,libmain.so -Wl,-u,ANativeActivity_onCreate \
            -Wl,--no-undefined obj/*.o -o lib/arm64-v8a/libmain.so \
            -landroid -llog -lEGL -lGLESv2 -lOpenSLES -ldl -lm

          # Native C++ games that use the NDK's shared libc++ must package it in the APK.
          cp "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" lib/arm64-v8a/libc++_shared.so

          "$BUILD_TOOLS/aapt" package -f -M AndroidManifest.xml -I "$PLATFORM" \
            -A assets -F unaligned.apk
          zip -u unaligned.apk lib/arm64-v8a/libmain.so lib/arm64-v8a/libc++_shared.so
          "$BUILD_TOOLS/zipalign" -f -p 4 unaligned.apk aligned.apk

          keytool -genkeypair -v -keystore test-release.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Chrono Protocol,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks test-release.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out ChronoProtocol.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose ChronoProtocol.apk
          "$BUILD_TOOLS/aapt" list ChronoProtocol.apk | grep -E 'lib/arm64-v8a/lib(main|c\+\+_shared)\.so|assets/audio/act1\.ogg|assets/textures/floor\.jpg'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronoProtocol-Android-APK
          path: ChronoProtocol.apk
          if-no-files-found: error
          retention-days: 14
