name: Build Installable Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: sdkmanager "ndk;26.1.10909125" "platforms;android-33" "build-tools;33.0.2" "cmake;3.22.1"

      - name: Build Raylib & Package Signed APK
        run: |
          export NDK=$ANDROID_HOME/ndk/26.1.10909125
          export BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2
          export PLATFORM=$ANDROID_HOME/platforms/android-33/android.jar

          # 1. Generate CMakeLists.txt automatically
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.22)
          project(ChronoProtocol LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(PLATFORM "Android" CACHE STRING "" FORCE)
          set(BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          include(FetchContent)
          FetchContent_Declare(raylib GIT_REPOSITORY https://github.com/raysan5/raylib.git GIT_TAG 5.5 GIT_SHALLOW TRUE)
          FetchContent_MakeAvailable(raylib)
          add_library(main SHARED main.cpp ${ANDROID_NDK}/sources/android/native_app_glue/android_native_app_glue.c)
          target_include_directories(main PRIVATE ${ANDROID_NDK}/sources/android/native_app_glue)
          target_link_libraries(main raylib android log EGL GLESv2 OpenSLES m)
          set_target_properties(main PROPERTIES LINK_FLAGS "-u ANativeActivity_onCreate")
          EOF

          # 2. Compile C++20 code into ARM64 native library
          cmake -B build -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=29 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a -DCMAKE_ANDROID_NDK=$NDK -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

          # 3. Create AndroidManifest.xml
          mkdir -p apk/lib/arm64-v8a
          cp build/libmain.so apk/lib/arm64-v8a/libmain.so
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.chronoprotocol.game" android:versionCode="1" android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application android:label="Chrono Protocol" android:hasCode="false"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="android.app.NativeActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">
                      <meta-data android:name="android.app.lib_name" android:value="main" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4. Package, Align, and Sign the APK
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -I $PLATFORM -F unaligned.apk apk
          $BUILD_TOOLS/zipalign -f 4 unaligned.apk aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out ChronoProtocol.apk aligned.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronoProtocol-Installable-APK
          path: ChronoProtocol.apk
          
